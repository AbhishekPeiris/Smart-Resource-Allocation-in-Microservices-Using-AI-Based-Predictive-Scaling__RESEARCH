apiVersion: v1
kind: Service
metadata:
  name: store-admin
  namespace: default
  labels:
    app: store-admin
    istio: proxy
    security.istio.io/tlsMode: istio
spec:
  type: LoadBalancer
  selector:
    app: store-admin
  ports:
    - name: http
      port: 80
      targetPort: 8081

    - name: http-envoy-prom
      port: 15090
      targetPort: 15090
