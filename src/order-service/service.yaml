apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: default
  labels:
    app: order-service
    prometheus: "true"
    istio: proxy
    security.istio.io/tlsMode: istio
spec:
  type: ClusterIP
  selector:
    app: order-service
  ports:
    - name: http
      port: 3000
      targetPort: 3000

    - name: http-envoy-prom
      port: 15090
      targetPort: 15090
